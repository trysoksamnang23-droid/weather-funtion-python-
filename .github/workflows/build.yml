name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip zlib1g-dev libltdl-dev
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Fix System Android SDK Paths & Accept Licenses
      run: |
        # Create legacy tools directory expected by Buildozer
        sudo mkdir -p /usr/local/lib/android/sdk/tools
        sudo ln -s /usr/local/lib/android/sdk/cmdline-tools/latest/bin /usr/local/lib/android/sdk/tools/bin
        
        # Accept licenses
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build APK with Buildozer
      run: buildozer -s android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cambodia-weather-apk
        path: bin/*.apk
